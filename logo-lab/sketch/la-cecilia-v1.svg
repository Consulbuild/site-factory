<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scheletro scritto da Claude: composizione, lettere esatte, geometria di base.
       Il generatore deve RENDERE questo schizzo come logo curato (craft), non reinventarlo. -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  <!-- contenitore: targa a angoli smussati -->
  <rect x="192" y="120" width="640" height="520" rx="48" fill="#1E3A8A"/>
  <!-- monogramma L + C: la C è un cronometro aperto, la L è il basamento -->
  <path d="M 300 240 L 300 520 L 470 520" fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M 700 330 A 150 150 0 1 0 700 530" fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="butt"/>
  <!-- corona del cronometro -->
  <rect x="592" y="216" width="72" height="44" fill="#ffffff"/>
  <!-- lancetta sulle 8 -->
  <line x1="606" y1="430" x2="530" y2="500" stroke="#F97316" stroke-width="28" stroke-linecap="round"/>
  <circle cx="606" cy="430" r="26" fill="#F97316"/>
  <!-- wordmark: lettere esatte -->
  <text x="512" y="760" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="900" font-size="132" letter-spacing="10" fill="#1E3A8A">LA CECILIA</text>
  <!-- payoff -->
  <text x="512" y="850" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="44" letter-spacing="14" fill="#F97316">BAGNI CHIAVI IN MANO · PUGLIA</text>
</svg>
