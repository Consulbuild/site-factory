# Generato dall'editor al deploy — non modificare a mano.
endpoints:
  - name: cavalierebuild.it
    group: clienti
    url: "https://cavalierebuild.it/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
